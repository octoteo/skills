      "category": "create",
      "prompt": "把这篇微信公众号文章转换成干净 Markdown：https://mp.weixin.qq.com/s/abc123",
      "expect_activation": true,
      "critical": true,
      "graders": [{"type": "prompt"}],
      "rubric": [
        "必须先获取真实公众号正文，不能仅依据标题、搜索摘要或猜测生成内容。",
        "应使用分层回退并明确识别验证码、环境异常、限流或错误页状态。",
        "不得向第三方公开代理泄露 Cookie、Token 或浏览器 profile 等私密会话数据。"
