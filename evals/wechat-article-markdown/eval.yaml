{
  "schema_version": 1,
  "name": "wechat-article-markdown",
  "description": "Paired routing and capability evaluation for reliable public WeChat article retrieval and Markdown conversion.",
  "type": "paired-capability",
  "score_scale": {
    "minimum": 0,
    "maximum": 2,
    "labels": {
      "0": "Missing, incorrect, unsafe, or materially unusable.",
      "1": "Partially correct but incomplete, weakly justified, or insufficiently validated.",
      "2": "Correct, specific, evidence-oriented, and operationally usable."
    }
  },
  "release_thresholds": {
    "positive_recall_min": 0.94,
    "negative_specificity_min": 1.0,
    "routing_accuracy_min": 0.96,
    "skilled_mean_min": 0.8,
    "mean_delta_min": 0.1,
    "win_rate_non_ties_min": 0.7,
    "sign_test_p_max": 0.05,
    "bootstrap_delta_ci_low_min": 0.0,
    "skilled_critical_failures_max": 0
  },
  "defaults": {
    "timeout": "5m",
    "runs": 1,
    "bootstrap_iterations": 10000,
    "bootstrap_seed": 0,
    "blind_seed": 0
  },
  "stimuli": [
