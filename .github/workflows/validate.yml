name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and package validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate repository skills and eval specifications
        run: python tools/validate_repository.py
      - name: Run deterministic tests
        run: python tools/run_tests.py
      - name: Package skill
        run: python tools/package_skill.py wpf-development .artifacts/wpf-development
      - name: Verify checksum
        working-directory: .artifacts/wpf-development
        run: sha256sum --check skill.zip.sha256
      - name: Validate prerelease gate plumbing
        run: |
          python tools/check_release.py \
            --tag wpf-development-v0.0.0-ci.1 \
            --manifest .artifacts/wpf-development/manifest.json \
            --results-root eval-results
      - name: Upload ephemeral package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpf-development-skill-${{ github.sha }}
          path: |
            .artifacts/wpf-development/skill.zip
            .artifacts/wpf-development/skill.zip.sha256
            .artifacts/wpf-development/manifest.json
          if-no-files-found: error
          retention-days: 14

  windows-wpf:
    name: Windows .NET 10 WPF - ${{ matrix.tier }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: compact
            product_name: Production.Compact
          - tier: product
            product_name: Production.Product
          - tier: modular
            product_name: Production.Modular
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@83c0c1a6c843e2d7e6b14cc940a4a8c77243829b # v4
        with:
          dotnet-version: '10.0.x'
      - name: Run repository tests on Windows
        run: python tools/run_tests.py
      - name: Execute and inspect WPF solution scaffold
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'wpf-scaffold-${{ matrix.tier }}'
          python wpf-development/scripts/scaffold_wpf_solution.py $destination --name '${{ matrix.product_name }}' --tier '${{ matrix.tier }}' --solution-format slnx --execute
          $root = Join-Path $destination '${{ matrix.product_name }}'
          $solution = Join-Path $root '${{ matrix.product_name }}.slnx'
          dotnet restore $solution
          dotnet build $solution --no-restore --configuration Release
          dotnet test $solution --no-build --configuration Release
          python wpf-development/scripts/inspect_wpf_project.py $root --format json --output (Join-Path $env:RUNNER_TEMP 'wpf-inspection-${{ matrix.tier }}.json') --strict
      - name: Upload Windows inspection report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpf-windows-validation-${{ matrix.tier }}-${{ github.sha }}
          path: ${{ runner.temp }}/wpf-inspection-${{ matrix.tier }}.json
          if-no-files-found: warn
          retention-days: 14
