name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository skills
        run: python tools/validate_repository.py
      - name: Run tests
        run: python tools/run_tests.py
      - name: Package WPF Development skill
        run: python tools/package_skill.py wpf-development "$RUNNER_TEMP/wpf-development"
      - name: Upload ephemeral package
        uses: actions/upload-artifact@v4
        with:
          name: wpf-development-skill
          path: ${{ runner.temp }}/wpf-development/skill.zip
          if-no-files-found: error
