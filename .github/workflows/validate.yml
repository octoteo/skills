name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and package validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate repository skills and eval specifications
        run: python tools/validate_repository.py
      - name: Run deterministic tests
        run: python tools/run_tests.py
      - name: Package skill
        run: python tools/package_skill.py wpf-development .artifacts/wpf-development
      - name: Verify checksum
        working-directory: .artifacts/wpf-development
        run: sha256sum --check skill.zip.sha256
      - name: Upload ephemeral package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wpf-development-skill-${{ github.sha }}
          path: |
            .artifacts/wpf-development/skill.zip
            .artifacts/wpf-development/skill.zip.sha256
            .artifacts/wpf-development/manifest.json
          if-no-files-found: error
          retention-days: 14

  windows-wpf:
    name: Windows .NET 10 WPF execution
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@5e931af6be0e018f807de246b52f546bfb8da48a # v4
        with:
          dotnet-version: '10.0.x'
      - name: Run repository tests on Windows
        run: python tools/run_tests.py
      - name: Execute WPF solution scaffold
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'wpf-scaffold'
          python wpf-development/scripts/scaffold_wpf_solution.py $destination --name Production.Sample --solution-format slnx --execute
          $solution = Join-Path $destination 'Production.Sample/Production.Sample.slnx'
          dotnet restore $solution
          dotnet build $solution --no-restore --configuration Release
          dotnet test $solution --no-build --configuration Release
          python wpf-development/scripts/inspect_wpf_project.py (Join-Path $destination 'Production.Sample') --format json --output (Join-Path $env:RUNNER_TEMP 'wpf-inspection.json') --strict
      - name: Upload Windows inspection report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wpf-windows-validation-${{ github.sha }}
          path: ${{ runner.temp }}/wpf-inspection.json
          if-no-files-found: warn
          retention-days: 14
