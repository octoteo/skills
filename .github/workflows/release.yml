name: Release WPF Development skill

on:
  push:
    tags:
      - 'wpf-development-v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate repository
        run: |
          python tools/validate_repository.py
          python tools/run_tests.py
      - name: Build deterministic release assets
        run: python tools/package_skill.py wpf-development .artifacts/wpf-development
      - name: Verify release checksum
        working-directory: .artifacts/wpf-development
        run: sha256sum --check skill.zip.sha256
      - name: Enforce tag and stable evaluation gate
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python tools/check_release.py \
            --tag "$GITHUB_REF_NAME" \
            --manifest .artifacts/wpf-development/manifest.json \
            --results-root eval-results
      - name: Prepare release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/release
          cp .artifacts/wpf-development/skill.zip .artifacts/release/
          cp .artifacts/wpf-development/skill.zip.sha256 .artifacts/release/
          cp .artifacts/wpf-development/manifest.json .artifacts/release/
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#wpf-development-v}"
            result_dir="eval-results/wpf-development/${version}"
            if [[ -f "${result_dir}/summary.json" ]]; then
              cp "${result_dir}/summary.json" .artifacts/release/evaluation-summary.json
              cp "${result_dir}/report.md" .artifacts/release/evaluation-report.md
            fi
          fi
      - name: Attest skill package provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: .artifacts/release/skill.zip
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wpf-development-release-${{ github.sha }}
          path: .artifacts/release/
          if-no-files-found: error
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_args=(--generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" "${release_args[@]}"
          gh release upload "$GITHUB_REF_NAME" .artifacts/release/* --clobber
