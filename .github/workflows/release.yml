name: Release WPF Development skill

on:
  push:
    tags:
      - 'wpf-development-v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate repository
        run: |
          python tools/validate_repository.py
          python tools/run_tests.py
      - name: Build deterministic release assets
        run: python tools/package_skill.py wpf-development .artifacts/wpf-development
      - name: Verify release checksum
        working-directory: .artifacts/wpf-development
        run: sha256sum --check skill.zip.sha256
      - name: Attest skill package provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: .artifacts/wpf-development/skill.zip
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wpf-development-release-${{ github.sha }}
          path: |
            .artifacts/wpf-development/skill.zip
            .artifacts/wpf-development/skill.zip.sha256
            .artifacts/wpf-development/manifest.json
          if-no-files-found: error
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            .artifacts/wpf-development/skill.zip \
            .artifacts/wpf-development/skill.zip.sha256 \
            .artifacts/wpf-development/manifest.json \
            --clobber
